<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Cast: your personal workspace, AI cast, community, and world map. This design preview saves your changes on this device."
    />
    <title>Cast · Your ideas, together</title>
    <style>
      #cast-startup {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #edf7ef;
        color: #24382d;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      #cast-startup[hidden],
      #cast-startup [hidden] {
        display: none !important;
      }
      #cast-startup section {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        background: white;
        padding: 32px;
        border: 1px solid #d4e7d8;
        border-radius: 24px;
      }
      #cast-startup .brand {
        font-size: 28px;
        letter-spacing: -1px;
      }
      #cast-startup .brand span {
        color: #189b51;
      }
      #cast-startup h1 {
        font-size: 24px;
        line-height: 1.3;
      }
      #cast-startup p {
        margin: 14px 0;
      }
      #cast-startup button,
      #cast-startup a {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #c8e1ce;
        border-radius: 12px;
        background: #e1f7e7;
        color: #164a2c;
        font: inherit;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      #cast-startup .hint {
        font-size: 14px;
        color: #506356;
      }
    </style>
  </head>
  <body>
    <div id="cast-startup">
      <section aria-labelledby="cast-startup-title">
        <div class="brand">cast <span>✳</span></div>
        <h1 id="cast-startup-title">Opening your workspace…</h1>
        <p id="cast-startup-message" role="status">Your preview is loading.</p>
        <div id="cast-startup-actions" hidden>
          <button id="cast-retry" type="button">Try again</button>
          <a href="?session=1">Open a temporary preview</a>
          <a id="cast-open-browser" href="./" target="_blank" rel="noopener"
            >Open in your browser</a
          >
          <p class="hint">
            If you’re using an in-app browser, open this link in Chrome, Edge,
            Firefox, or Safari. Temporary mode leaves saved preview data
            untouched; new changes last until reload.
          </p>
        </div>
        <noscript
          ><p>
            This preview needs JavaScript. Enable it, then reopen this link in
            your browser.
          </p></noscript
        >
      </section>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var ready = false;
        function showRecovery() {
          if (ready) return;
          document.getElementById("cast-startup-title").textContent =
            "Let’s reopen your preview.";
          document.getElementById("cast-startup-message").textContent =
            "The workspace hasn’t finished opening. Retry with a fresh page, or open this link in your browser.";
          document.getElementById("cast-startup-actions").hidden = false;
        }
        var timer = setTimeout(showRecovery, 15000);
        window.addEventListener("cast:startup-failed", showRecovery);
        window.addEventListener(
          "error",
          function (event) {
            if (event.target && event.target.tagName === "SCRIPT")
              showRecovery();
          },
          true,
        );
        window.addEventListener("cast:startup-ready", function () {
          ready = true;
          clearTimeout(timer);
          document.getElementById("cast-startup").hidden = true;
        });
        document.getElementById("cast-open-browser").href = location.href;
        document.getElementById("cast-retry").onclick = function () {
          var url = new URL(location.href);
          url.searchParams.set("reload", String(Date.now()));
          location.assign(url.href);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
